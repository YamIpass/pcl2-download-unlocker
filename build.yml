name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with .NET Framework csc
        shell: pwsh
        run: ./build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCL2DownloadUnlocker
          path: dist/*.exe
          if-no-files-found: error
